databaseChangeLog:
  - changeSet:
      id: 002-create-workload-years-table
      author: khram0v
      changes:
        - createTable:
            tableName: workload_years
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: trainer_username
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: year
                  type: INTEGER
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: workload_years
            baseColumnNames: trainer_username
            referencedTableName: trainer_workloads
            referencedColumnNames: username
            constraintName: fk_workload_year_trainer
            onDelete: CASCADE
        - addUniqueConstraint:
            tableName: workload_years
            columnNames: trainer_username, year
            constraintName: uq_workload_year_trainer_year
