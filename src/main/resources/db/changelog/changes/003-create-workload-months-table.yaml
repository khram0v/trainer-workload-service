databaseChangeLog:
  - changeSet:
      id: 003-create-workload-months-table
      author: khram0v
      changes:
        - createTable:
            tableName: workload_months
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: workload_year_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: month
                  type: INTEGER
                  constraints:
                    nullable: false
              - column:
                  name: training_summary_duration
                  type: INTEGER
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: workload_months
            baseColumnNames: workload_year_id
            referencedTableName: workload_years
            referencedColumnNames: id
            constraintName: fk_workload_month_year
            onDelete: CASCADE
        - addUniqueConstraint:
            tableName: workload_months
            columnNames: workload_year_id, month
            constraintName: uq_workload_month_year_month
