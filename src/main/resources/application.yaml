server:
  port: 8082

spring:
  application:
    name: trainer-workload-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/trainer-workload}
    username: ${DB_USERNAME:workload_user}
    password: ${DB_PASSWORD:workload_password}
    driver-class-name: org.postgresql.Driver
  activemq:
    broker-url: ${ACTIVEMQ_BROKER_URL:tcp://localhost:61616}
    user: ${ACTIVEMQ_USER:admin}
    password: ${ACTIVEMQ_PASSWORD:admin}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
      jakarta:
        persistence:
          validation:
            mode: none
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

security:
  service:
    secret: ${SERVICE_JWT_SERVICE:local-only-dev-shared-secret-key-not-for-prod-use-1234567890}

messaging:
  trainer-workload-events-queue: ${TRAINER_WORKLOAD_EVENTS_QUEUE:trainer-workload.events}
  trainer-workload-events-dlq: ${TRAINER_WORKLOAD_EVENTS_DLQ:trainer-workload.events.dlq}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
