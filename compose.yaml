services:
  postgres:
    image: postgres:16-alpine
    container_name: trainer-workload-postgres
    environment:
      POSTGRES_DB: trainer_workload
      POSTGRES_USER: workload_user
      POSTGRES_PASSWORD: workload_password
    ports:
      - '5433:5432'
    volumes:
      - trainer_workload_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workload_user -d trainer_workload"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  trainer_workload_data:
