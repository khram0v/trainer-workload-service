services:
  postgres:
    image: postgres:16-alpine
    container_name: trainer-workload-postgres
    environment:
      POSTGRES_DB: trainer_workload
      POSTGRES_USER: workload_user
      POSTGRES_PASSWORD: workload_password
    ports:
      - '5433:5432'
    volumes:
      - trainer_workload_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workload_user -d trainer_workload"]
      interval: 5s
      timeout: 5s
      retries: 5

  activemq:
    image: apache/activemq-classic:6.1.6
    container_name: gym-crm-activemq
    ports:
      - "61616:61616"
      - "8161:8161"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider --user=admin --password=admin http://localhost:8161/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  trainer_workload_data:
